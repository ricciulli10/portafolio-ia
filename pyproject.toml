[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-portfolio"
version = "0.1.0"
description = "Applied ML and AI agents portfolio: credit risk, RAG, agent runtime, transformer from scratch"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "joblib>=1.4",
  "matplotlib>=3.9",
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "anthropic>=2.4",
]

[project.optional-dependencies]
dl = ["torch>=2.5"]
embed = ["sentence-transformers>=3"]
mlops = ["mlflow>=3"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk", "src/rag_lab", "src/agentkit", "src/underwriter", "src/tiny_transformer", "src/intake_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["torch: needs PyTorch"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends-style defaults
